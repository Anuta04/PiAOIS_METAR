<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главное меню</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div style="text-align: right; margin-bottom: 10px; font-family: Arial;">
            Вы вошли как: <b>{{ session.username }}</b> ({{ session.role }}) | <a href="/logout">Выйти</a>
        </div>
        <h2>Информационная система мониторинга METAR</h2>
        
        <div class="nav-tabs">
            <a href="/check">Проверка рейса</a>
            <a href="/history">Аналитика истории</a>
            {% if session.role == 'admin' %}<a href="/admin">Пользователи</a>{% endif %}
        </div>
        
        <div style="text-align: center; margin-top: 50px; font-family: Arial;">
            <p>Выберите необходимый раздел в меню выше.</p>
        </div>
    </div>
</body>
</html>
